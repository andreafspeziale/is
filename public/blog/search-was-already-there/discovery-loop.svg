<svg xmlns="http://www.w3.org/2000/svg" width="380" height="510" viewBox="0 0 380 510" role="img" aria-labelledby="title description">
  <title id="title">Agent search discovery loop</title>
  <desc id="description">The agent lists indices, inspects a mapping, constructs a query, then searches and interprets the results.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#aca1cf" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { fill: #c9c7cd; font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 14px; }
    .accent { fill: #b9aeda; font-weight: 600; }
    .line { fill: none; stroke: #aca1cf; stroke-linecap: round; stroke-width: 1.5; }
  </style>
  <rect x="1" y="1" width="378" height="508" rx="6" fill="#131314" stroke="#2a2a2d" stroke-width="2"/>
  <rect x="40" y="28" width="300" height="58" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="63" text-anchor="middle" class="accent">what can I search?</text>
  <path class="line" d="M190 86v37" marker-end="url(#arrow)"/>
  <rect x="40" y="123" width="300" height="58" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="158" text-anchor="middle">list indices and aliases</text>
  <path class="line" d="M190 181v37" marker-end="url(#arrow)"/>
  <rect x="40" y="218" width="300" height="58" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="253" text-anchor="middle">inspect the selected mapping</text>
  <path class="line" d="M190 276v37" marker-end="url(#arrow)"/>
  <rect x="40" y="313" width="300" height="58" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="348" text-anchor="middle">construct a valid query</text>
  <path class="line" d="M190 371v37" marker-end="url(#arrow)"/>
  <rect x="40" y="408" width="300" height="58" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="443" text-anchor="middle" class="accent">search and interpret results</text>
</svg>
