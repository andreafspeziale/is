<svg xmlns="http://www.w3.org/2000/svg" width="380" height="590" viewBox="0 0 380 590" role="img" aria-labelledby="title description">
  <title id="title">Search integration ecosystem</title>
  <desc id="description">Applications connect through schemas, transformations, query semantics, access control, client configuration, caching, errors and observability to a search engine.</desc>
  <defs>
