  </defs>
  <style>
    text { fill: #c9c7cd; font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 14px; }
    .muted { fill: #9998a8; }
    .accent { fill: #b9aeda; font-weight: 600; }
    .line { fill: none; stroke: #aca1cf; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5; }
  </style>
  <rect x="1" y="1" width="378" height="588" rx="6" fill="#131314" stroke="#2a2a2d" stroke-width="2"/>

  <rect x="70" y="28" width="240" height="52" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="60" text-anchor="middle" class="accent">applications</text>
  <path class="line" d="M190 80v42" marker-end="url(#arrow)"/>

  <rect x="28" y="122" width="324" height="354" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="52" y="158" class="muted">search integration</text>
  <path class="line" d="M48 185v244"/>
  <path class="line" d="M48 202h20M48 238h20M48 274h20M48 310h20M48 346h20M48 382h20M48 418h20"/>
  <text x="82" y="207">schemas and mappings</text>
  <text x="82" y="243">document transformations</text>
  <text x="82" y="279">query semantics</text>
  <text x="82" y="315">access control</text>
  <text x="82" y="351">client configuration</text>
  <text x="82" y="387">caching and errors</text>
  <text x="82" y="423">observability and operations</text>

  <path class="line" d="M190 476v42" marker-end="url(#arrow)"/>
  <rect x="70" y="518" width="240" height="52" rx="5" fill="#161617" stroke="#3e3e43"/>
