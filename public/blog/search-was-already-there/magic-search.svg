<svg xmlns="http://www.w3.org/2000/svg" width="380" height="116" viewBox="0 0 380 116" role="img" aria-labelledby="title description">
  <title id="title">Magic search engine misconception</title>
  <desc id="description">Human language does not pass directly into a magic search engine.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#aca1cf" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { fill: #c9c7cd; font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 14px; }
    .bad { fill: #f5a191; }
    .line { fill: none; stroke: #aca1cf; stroke-linecap: round; stroke-width: 1.5; }
  </style>
  <rect x="1" y="1" width="378" height="114" rx="6" fill="#131314" stroke="#2a2a2d" stroke-width="2"/>
  <rect x="20" y="32" width="130" height="52" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="85" y="63" text-anchor="middle">human language</text>
  <path class="line" d="M150 58h80" marker-end="url(#arrow)"/>
  <rect x="230" y="32" width="130" height="52" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="295" y="54" text-anchor="middle" class="bad">magic search</text>
  <text x="295" y="73" text-anchor="middle" class="bad">engine</text>
</svg>
