<svg xmlns="http://www.w3.org/2000/svg" width="380" height="570" viewBox="0 0 380 570" role="img" aria-labelledby="title description">
  <title id="title">Evolution into se-platform</title>
  <desc id="description">A migration led to understanding the ecosystem, a shared HTTP boundary, application governance, MCP and CLI adapters, catalog and log targets, then se-platform.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#aca1cf" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { fill: #c9c7cd; font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 14px; }
    .accent { fill: #b9aeda; font-weight: 600; }
    .line { fill: none; stroke: #aca1cf; stroke-linecap: round; stroke-width: 1.5; }
  </style>
  <rect x="1" y="1" width="378" height="568" rx="6" fill="#131314" stroke="#2a2a2d" stroke-width="2"/>
  <rect x="40" y="24" width="300" height="52" rx="5" fill="#161617" stroke="#3e3e43"/><text x="190" y="56" text-anchor="middle">migration</text>
  <path class="line" d="M190 76v30" marker-end="url(#arrow)"/>
  <rect x="40" y="106" width="300" height="52" rx="5" fill="#161617" stroke="#3e3e43"/><text x="190" y="138" text-anchor="middle">understanding the ecosystem</text>
  <path class="line" d="M190 158v30" marker-end="url(#arrow)"/>
  <rect x="40" y="188" width="300" height="52" rx="5" fill="#161617" stroke="#3e3e43"/><text x="190" y="220" text-anchor="middle">shared HTTP boundary</text>
  <path class="line" d="M190 240v30" marker-end="url(#arrow)"/>
  <rect x="40" y="270" width="300" height="52" rx="5" fill="#161617" stroke="#3e3e43"/><text x="190" y="302" text-anchor="middle">application-level governance</text>
  <path class="line" d="M190 322v30" marker-end="url(#arrow)"/>
  <rect x="40" y="352" width="300" height="52" rx="5" fill="#161617" stroke="#3e3e43"/><text x="190" y="384" text-anchor="middle">MCP and CLI adapters</text>
  <path class="line" d="M190 404v30" marker-end="url(#arrow)"/>
  <rect x="40" y="434" width="300" height="52" rx="5" fill="#161617" stroke="#3e3e43"/><text x="190" y="466" text-anchor="middle">catalog + log targets</text>
  <path class="line" d="M190 486v30" marker-end="url(#arrow)"/>
  <rect x="40" y="516" width="300" height="34" rx="5" fill="#161617" stroke="#3e3e43"/><text x="190" y="539" text-anchor="middle" class="accent">se-platform</text>
</svg>
