<svg xmlns="http://www.w3.org/2000/svg" width="380" height="580" viewBox="0 0 380 580" role="img" aria-labelledby="title description">
  <title id="title">Neural network embedding flow</title>
  <desc id="description">The sentence I walk in the rain is tokenized, passed through successive model weight matrices and transformed into a 1024-dimensional float32 embedding vector.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#aca1cf" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { fill: #c9c7cd; font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 14px; }
    .muted { fill: #9998a8; font-size: 12px; }
    .accent { fill: #b9aeda; font-weight: 600; }
    .line { fill: none; stroke: #aca1cf; stroke-linecap: round; stroke-width: 1.5; }
  </style>
  <rect x="1" y="1" width="378" height="578" rx="6" fill="#131314" stroke="#2a2a2d" stroke-width="2"/>

  <rect x="40" y="24" width="300" height="54" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="57" text-anchor="middle" class="accent">"I walk in the rain"</text>
  <path class="line" d="M190 78v34" marker-end="url(#arrow)"/>

  <rect x="40" y="112" width="300" height="62" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="139" text-anchor="middle">tokenization</text>
  <text x="190" y="160" text-anchor="middle" class="muted">text → numbers</text>
  <path class="line" d="M190 174v34" marker-end="url(#arrow)"/>

  <rect x="40" y="208" width="300" height="62" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="235" text-anchor="middle">weight matrix · layer 1</text>
  <text x="190" y="256" text-anchor="middle" class="muted">input → output layer 1</text>
  <path class="line" d="M190 270v34" marker-end="url(#arrow)"/>

  <rect x="40" y="304" width="300" height="62" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="331" text-anchor="middle">weight matrix · layer 2</text>
  <text x="190" y="352" text-anchor="middle" class="muted">output layer 1 → output layer 2</text>
  <path class="line" d="M190 366v34" marker-end="url(#arrow)"/>

  <text x="190" y="425" text-anchor="middle" class="muted">... 36 layers ...</text>
  <path class="line" d="M190 442v34" marker-end="url(#arrow)"/>

  <rect x="40" y="476" width="300" height="72" rx="5" fill="#161617" stroke="#3e3e43"/>
  <text x="190" y="506" text-anchor="middle" class="accent">embedding vector</text>
  <text x="190" y="530" text-anchor="middle" class="muted">1024 float32 numbers</text>
</svg>
